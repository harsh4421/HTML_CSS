<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexDash</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        
        <nav class="sidebar">
            <div class="logo">FlexDash</div>
            <div class="menu-items">
                <a href="#" class="menu-link active">Dashboard</a>
                <a href="#" class="menu-link">Analytics</a>
                <a href="#" class="menu-link">Users</a>
                <a href="#" class="menu-link">Reports</a>
                <a href="#" class="menu-link">Settings</a>
            </div>
        </nav>

        <main class="main-content">
            
            <header class="top-bar">
                <div class="search-container">
                    <input type="text" placeholder="Search dashboard..." class="search-input">
                </div>
                <div class="user-profile">
                    <span class="user-icon">👤</span> Admin
                </div>
            </header>

            <div class="dashboard-view">
                
                <div class="card-row">
                    <div class="card white-card">
                        <span class="card-title">Users</span>
                        <span class="card-value">1,240</span>
                    </div>
                    <div class="card white-card">
                        <span class="card-title">Revenue</span>
                        <span class="card-value">₹2.4L</span>
                    </div>
                    <div class="card white-card">
                        <span class="card-title">Orders</span>
                        <span class="card-value">320</span>
                    </div>
                </div>

                <div class="card-row">
                    <div class="card blue-card">
                        <span class="card-title">Growth</span>
                        <span class="card-value">+18%</span>
                    </div>
                    <div class="card blue-card">
                        <span class="card-title">Conversion</span>
                        <span class="card-value">5.4%</span>
                    </div>
                </div>

            </div>
        </main>

    </div>

</body>
</html>
